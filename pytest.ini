[pytest]
# Collect only the authoritative source tree at the repository root.
# Doc/ contains many historical snapshots of this same codebase; recursing
# into them produces duplicate module names and collection errors.
testpaths = .
norecursedirs = Doc Data results archive figs reference_checks TASGL_github_release __pycache__ .git .idea .pytest_cache .venv venv
python_files = test_*.py
